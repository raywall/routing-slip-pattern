<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Routing Slip Studio: editor, lint e simulador de workflows YAML." />
    <title>Routing Slip Studio</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <aside id="sidebar" class="sidebar">
      <header class="sidebar-head">
        <div>
          <p class="eyebrow">Routing Slip</p>
          <h1>Studio</h1>
        </div>
        <span id="lint-badge" class="badge badge-warn">Lint</span>
      </header>

      <section id="config-panel" class="fold-panel">
        <button class="fold-head" type="button" data-toggle-panel="config-panel">
          <span>Configuracao</span>
          <span class="fold-icon">▾</span>
        </button>
        <div class="fold-body control-panel">
          <label>
            Exemplo
            <select id="example-select">
              <option value="payment">Pagamento aprovado</option>
              <option value="baixa">Baixa de parcelas</option>
              <option value="blank">Workflow vazio</option>
            </select>
          </label>
          <label class="toggle">
            <input id="execute-integrations" type="checkbox" />
            <span>Chamar integracoes reais</span>
          </label>
          <label>
            GraphQL endpoint
            <input id="graphql-endpoint" type="url" value="http://localhost:8090/graphql" />
          </label>
          <label>
            REST workflow endpoint
            <input id="workflow-endpoint" type="url" value="http://localhost:8088/process" />
          </label>
          <label>
            External API URL
            <input id="external-api-url" type="url" value="https://mock.raysouz.studio" />
          </label>
          <div class="button-row">
            <button id="load-example" type="button">Carregar</button>
            <button id="send-rest" type="button">Enviar REST</button>
          </div>
        </div>
      </section>

      <section id="payload-panel" class="fold-panel fold-panel--compact">
        <button class="fold-head" type="button" data-toggle-panel="payload-panel">
          <span>Payload de entrada</span>
          <span class="fold-icon">▾</span>
        </button>
        <div class="fold-body payload-panel">
          <textarea id="payload-editor" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
        </div>
      </section>

      <section class="editor-panel">
        <div class="panel-title">
          <h2>Workflow YAML</h2>
          <span id="line-count">0 linhas</span>
        </div>
        <div class="editor-frame">
          <pre id="editor-lines" class="editor-lines" aria-hidden="true">1</pre>
          <textarea id="workflow-editor" spellcheck="false" autocomplete="off" autocapitalize="off" wrap="off"></textarea>
        </div>
        <div id="lint-result" class="lint-result">Aguardando validacao.</div>
        <footer class="editor-actions">
          <button id="toggle-comment" type="button">Comentar</button>
          <button id="format-yaml" type="button">Organizar</button>
          <button id="lint-now" type="button">Validar</button>
          <button id="clear-logs" type="button">Limpar logs</button>
          <button id="run-test" class="primary" type="button">Executar teste</button>
        </footer>
      </section>
    </aside>
    <div id="sidebar-resizer" class="sidebar-resizer" role="separator" aria-label="Redimensionar sidebar"></div>

    <main class="workspace">
      <header class="topbar">
        <div>
          <p class="eyebrow">Execucao</p>
          <h2 id="workflow-title">Workflow</h2>
        </div>
        <span id="run-summary">Nenhuma execucao</span>
      </header>

      <section class="execution-panel">
        <div class="panel-title">
          <h2>Logs da execucao</h2>
          <span>Timeline</span>
        </div>
        <div id="timeline" class="timeline"></div>
      </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
