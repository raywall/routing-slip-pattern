services:
  routing-slip-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_CMD: ". --config /workspace/config.yaml --workflow /workspace/workflows/baixa-parcelas.yaml"
    working_dir: /workspace/app
    volumes:
      - ./app:/workspace/app
      - ./config.yaml:/workspace/config.yaml:ro
      - ./workflows:/workspace/workflows:ro
      - ./.gocache:/workspace/.gocache
    environment:
      GOCACHE: /workspace/.gocache
      METRICS_ENDPOINT: http://host.docker.internal:8080/v1/metrics
      GRAPHQL_ENDPOINT: http://host.docker.internal:8090/graphql
      EXTERNAL_API_URL: https://mock.raysouz.studio
      EXTERNAL_API_SERIAL: b7af3a9e-6d1a-4b15-9837-3e0f0b47e5b4
      KAFKA_BROKERS: kafka:9092
      SQS_ENDPOINT: http://localstack:4566
      SQS_QUEUE_URL: http://localstack:4566/000000000000/payment-events
      PERSISTENT_STATE_ENABLED: "true"
      STATE_STORE_TYPE: dynamodb
      STATE_STORE_ENDPOINT: http://localstack:4566
      STATE_STORE_TABLE: routing-slip-state
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: us-east-1
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      localstack-init:
        condition: service_completed_successfully
    ports:
      - "8088:8088"

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9092:29092"

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      - kafka
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1; do sleep 1; done;
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092
      --create --if-not-exists
      --topic payment-events
      --partitions 1
      --replication-factor 1"

  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: sqs,dynamodb
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    ports:
      - "4566:4566"
    volumes:
      - localstack-data:/var/lib/localstack

  localstack-init:
    image: amazon/aws-cli:2.17.57
    depends_on:
      - localstack
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "until aws --endpoint-url=http://localstack:4566 sqs list-queues >/dev/null 2>&1; do sleep 1; done;
      aws --endpoint-url=http://localstack:4566 sqs create-queue --queue-name payment-events >/dev/null || true;
      aws --endpoint-url=http://localstack:4566 dynamodb create-table
      --table-name routing-slip-state
      --attribute-definitions AttributeName=pk,AttributeType=S AttributeName=sk,AttributeType=S
      --key-schema AttributeName=pk,KeyType=HASH AttributeName=sk,KeyType=RANGE
      --billing-mode PAY_PER_REQUEST
      || true;
      aws --endpoint-url=http://localstack:4566 dynamodb update-time-to-live
      --table-name routing-slip-state
      --time-to-live-specification Enabled=true,AttributeName=expires_at
      || true"

volumes:
  localstack-data:
