services:
  routing-slip-app:
    build:
      context: ./app
      dockerfile: ../docker/app/Dockerfile
      args:
        APP_CMD: "."
    working_dir: /workspace/app
    volumes:
      - ./app:/workspace/app
      - ./.gocache:/workspace/.gocache
    environment:
      METRICS_ENDPOINT: "http://metrics-service:8080/v1/metrics"
      GRAPHQL_ENDPOINT: "http://go-graphql-connector:8090/graphql"
      GOCACHE: "/workspace/.gocache"
    depends_on:
      metrics-service:
        condition: service_started
      go-graphql-connector:
        condition: service_started

  mock-external-api:
    build:
      context: ./app
      dockerfile: ../docker/app/Dockerfile
      args:
        APP_CMD: "./cmd/mock-external-api"
    working_dir: /workspace/app
    volumes:
      - ./app:/workspace/app
      - ./.gocache:/workspace/.gocache
    environment:
      GOCACHE: "/workspace/.gocache"
    ports:
      - "8091:8091"

  go-graphql-connector:
    build:
      context: ./app
      dockerfile: ../docker/app/Dockerfile
      args:
        APP_CMD: "./cmd/mock-graphql"
    working_dir: /workspace/app
    volumes:
      - ./app:/workspace/app
      - ./.gocache:/workspace/.gocache
    environment:
      EXTERNAL_API_URL: "http://mock-external-api:8091"
      GOCACHE: "/workspace/.gocache"
    depends_on:
      - mock-external-api
    ports:
      - "8090:8090"

  dynamodb:
    build:
      context: .
      dockerfile: docker/dynamodb-local/Dockerfile
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    working_dir: /home/dynamodblocal
    ports:
      - "8000:8000"

  dynamodb-init:
    build:
      context: .
      dockerfile: docker/dynamodb-init/Dockerfile
    depends_on:
      - dynamodb
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "until aws dynamodb list-tables --endpoint-url http://dynamodb:8000 >/dev/null 2>&1; do sleep 1; done;
      aws dynamodb create-table
      --endpoint-url http://dynamodb:8000
      --table-name custom-business-metrics-events
      --attribute-definitions AttributeName=pk,AttributeType=S AttributeName=sk,AttributeType=S AttributeName=correlation_id,AttributeType=S AttributeName=timestamp,AttributeType=S
      --key-schema AttributeName=pk,KeyType=HASH AttributeName=sk,KeyType=RANGE
      --global-secondary-indexes '[{\"IndexName\":\"correlation-index\",\"KeySchema\":[{\"AttributeName\":\"correlation_id\",\"KeyType\":\"HASH\"},{\"AttributeName\":\"timestamp\",\"KeyType\":\"RANGE\"}],\"Projection\":{\"ProjectionType\":\"ALL\"}}]'
      --billing-mode PAY_PER_REQUEST
      || true;
      aws dynamodb update-time-to-live
      --endpoint-url http://dynamodb:8000
      --table-name custom-business-metrics-events
      --time-to-live-specification Enabled=true,AttributeName=expires_at
      || true"

  metrics-service:
    build:
      context: ./custom-business-metrics/service
      dockerfile: ../../docker/metrics-service/Dockerfile
    depends_on:
      dynamodb-init:
        condition: service_completed_successfully
    environment:
      SERVICE_ADDR: ":8080"
      STORAGE_BACKEND: "dynamodb"
      DYNAMODB_ENDPOINT: "http://dynamodb:8000"
      DYNAMODB_TABLE: "custom-business-metrics-events"
      AWS_REGION: "us-east-1"
      AWS_ACCESS_KEY_ID: "local"
      AWS_SECRET_ACCESS_KEY: "local"
      RETENTION_DAYS: "7"
    ports:
      - "8080:8080"

  metrics-agent:
    build:
      context: ./custom-business-metrics/agent
      dockerfile: ../../docker/metrics-agent/Dockerfile
    depends_on:
      - metrics-service
    environment:
      AGENT_UDP_ADDR: ":8125"
      SERVICE_INGEST_URL: "http://metrics-service:8080/v1/metrics"
      AGENT_BATCH_SIZE: "20"
      AGENT_FLUSH_INTERVAL: "1s"
    ports:
      - "8125:8125/udp"

  metrics-webview:
    build:
      context: ./custom-business-metrics/webview
      dockerfile: ../../docker/metrics-webview/Dockerfile
    depends_on:
      - metrics-service
    ports:
      - "5173:80"
