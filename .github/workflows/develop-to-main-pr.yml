name: Abrir PR develop para main

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: develop-to-main-pr
  cancel-in-progress: true

jobs:
  open-pr:
    name: Preparar PR para producao
    runs-on: ubuntu-latest

    steps:
      - name: Criar ou atualizar PR
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const base = "main";
            const head = "develop";
            const headRef = `${owner}:${head}`;

            const comparison = await github.rest.repos.compareCommitsWithBasehead({
              owner,
              repo,
              basehead: `${base}...${head}`,
            });

            if (comparison.data.status === "identical" || comparison.data.ahead_by === 0) {
              core.info(`Branch ${head} nao possui commits novos em relacao a ${base}.`);
              return;
            }

            const existing = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              base,
              head: headRef,
              per_page: 1,
            });

            const title = "Promover develop para main";
            const body = [
              "PR aberto automaticamente a partir de atualizacao na branch `develop`.",
              "",
              "Revise as alteracoes, valide o Studio/publicacao e aprove o merge quando estiver pronto.",
              "",
              `Commits pendentes: ${comparison.data.ahead_by}`,
              `Ultimo commit: ${context.sha}`,
            ].join("\n");

            if (existing.data.length > 0) {
              const pr = existing.data[0];
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: pr.number,
                title,
                body,
              });
              core.info(`PR existente atualizado: #${pr.number}`);
              return;
            }

            const created = await github.rest.pulls.create({
              owner,
              repo,
              title,
              head,
              base,
              body,
              maintainer_can_modify: true,
            });

            core.info(`PR criado: #${created.data.number}`);
