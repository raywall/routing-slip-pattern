name: Publicar Studio

on:
  push:
    branches:
      - main
      - develop
    paths:
      - studio/**
      - .github/workflows/studio-pages.yml
  pull_request:
    branches:
      - main
      - develop
    paths:
      - studio/**
      - .github/workflows/studio-pages.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: studio-pages-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validar Studio
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validar assets e documentacao
        shell: bash
        run: |
          test -f studio/index.html
          test -f studio/scripts/routing-slip.studio.bootstrap.js
          test -f studio/styles/routing-slip.studio.base.css
          test -d studio/docs/content

          for file in studio/scripts/*.js studio/docs/*.js; do
            node --check "$file"
          done

          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = 'studio/docs/content';
          const files = [];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (/\.md$/i.test(entry.name)) files.push(full);
            }
          }
          walk(root);
          if (!files.length) throw new Error('Documentacao sem arquivos Markdown');
          const sections = new Set(files.map((file) => path.dirname(file)));
          for (const section of sections) {
            const index = path.join(section, 'index.md');
            if (!fs.existsSync(index)) throw new Error(`Secao sem index.md: ${section}`);
          }
          for (const file of files) {
            const text = fs.readFileSync(file, 'utf8');
            if (!/^---\n[\s\S]*?\n---\n/.test(text)) {
              throw new Error(`Arquivo sem front matter: ${file}`);
            }
          }
          console.log(`documentacao validada: ${files.length} arquivos Markdown`);
          NODE

  deploy:
    name: Publicar Studio
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Montar artefato do Studio
        shell: bash
        run: |
          rm -rf pages-dist
          mkdir -p pages-dist
          cp -R studio/. pages-dist/
          touch pages-dist/.nojekyll

          if [ "${{ github.ref_name }}" = "main" ]; then
            BASE_PATH="/routing-slip-pattern"
            ENV_NAME="production"
          else
            BASE_PATH="/routing-slip-pattern/dev"
            ENV_NAME="development"
          fi

          BASE_HREF="${BASE_PATH%/}/"
          sed -i "s|</title>|</title><base href=\"${BASE_HREF}\">|" pages-dist/index.html
          sed -i "s|</head>|<meta name=\"studio-env\" content=\"${ENV_NAME}\" data-base=\"${BASE_PATH}\"></head>|" pages-dist/index.html
          find pages-dist -name ".DS_Store" -delete

      - name: Publicar producao
        if: github.ref_name == 'main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./pages-dist
          keep_files: true

      - name: Publicar desenvolvimento
        if: github.ref_name == 'develop'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./pages-dist
          destination_dir: dev
          keep_files: true
