name: studio pages

on:
  pull_request:
    branches:
      - main
    paths:
      - studio/**
      - .github/workflows/studio-pages.yml
  push:
    branches:
      - main
    paths:
      - studio/**
      - .github/workflows/studio-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: studio-pages
  cancel-in-progress: false

jobs:
  build:
    name: gerar studio
    runs-on: ubuntu-latest

    steps:
      - name: baixar codigo
        uses: actions/checkout@v4

      - name: configurar node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: configurar github pages
        uses: actions/configure-pages@v5

      - name: validar assets do studio
        shell: bash
        run: |
          test -f studio/index.html
          test -f studio/scripts/routing-slip.studio.bootstrap.js
          test -f studio/styles/routing-slip.studio.base.css
          test -d studio/docs/content
          for file in studio/scripts/*.js studio/docs/*.js; do
            node --check "$file"
          done
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const path = require('path');
          const source = fs.readFileSync('studio/docs/documentation.js', 'utf8');
          const sandbox = { window: {} };
          vm.runInNewContext(source, sandbox);
          let count = 0;
          for (const section of sandbox.window.RoutingSlipDocs || []) {
            for (const item of section.items || []) {
              count++;
              const file = path.join('studio/docs', item.file || '');
              if (!item.file || !fs.existsSync(file)) {
                throw new Error(`Arquivo de documentacao nao encontrado: ${file}`);
              }
            }
          }
          if (count === 0) throw new Error('Manifesto de documentacao sem itens');
          console.log(`documentacao validada: ${count} itens`);
          NODE

      - name: montar artefato
        shell: bash
        run: |
          rm -rf pages-dist
          mkdir -p pages-dist
          cp -R studio/. pages-dist/
          test -f pages-dist/docs/content/06-studio/01-visao-geral.md
          test -f pages-dist/docs/content/06-studio/04-payload.md
          test -f pages-dist/docs/content/06-studio/05-resumo-da-execucao.md
          test -f pages-dist/docs/content/06-studio/06-config-e-documentacao.md
          touch pages-dist/.nojekyll

      - name: enviar artefato do pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

  deploy:
    name: publicar pages
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: publicar no github pages
        id: deployment
        uses: actions/deploy-pages@v4
