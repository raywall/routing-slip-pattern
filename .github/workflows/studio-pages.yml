name: studio pages

on:
  pull_request:
    branches: [main, develop]
    paths:
      - studio/**
      - .github/workflows/studio-pages.yml
  push:
    branches: [main, develop]
    paths:
      - studio/**
      - .github/workflows/studio-pages.yml
  workflow_dispatch:

permissions:
  contents: write # necessário para o peaceiris escrever na gh-pages

concurrency:
  group: studio-pages-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: gerar studio
    runs-on: ubuntu-latest

    steps:
      - name: baixar codigo
        uses: actions/checkout@v4

      - name: configurar node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: validar assets do studio
        shell: bash
        run: |
          test -f studio/index.html
          test -f studio/scripts/routing-slip.studio.bootstrap.js
          test -f studio/styles/routing-slip.studio.base.css
          test -d studio/docs/content
          for file in studio/scripts/*.js studio/docs/*.js; do
            node --check "$file"
          done
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const path = require('path');
          const source = fs.readFileSync('studio/docs/documentation.js', 'utf8');
          const sandbox = { window: {} };
          vm.runInNewContext(source, sandbox);
          let count = 0;
          for (const section of sandbox.window.RoutingSlipDocs || []) {
            for (const item of section.items || []) {
              count++;
              const file = path.join('studio/docs', item.file || '');
              if (!item.file || !fs.existsSync(file)) {
                throw new Error(`Arquivo de documentacao nao encontrado: ${file}`);
              }
            }
          }
          if (count === 0) throw new Error('Manifesto de documentacao sem itens');
          console.log(`documentacao validada: ${count} itens`);
          NODE

      - name: montar artefato
        shell: bash
        run: |
          rm -rf pages-dist
          mkdir -p pages-dist
          cp -R studio/. pages-dist/
          touch pages-dist/.nojekyll

          # injeta a variável de ambiente de versão no HTML
          BRANCH="${{ github.ref_name }}"
          if [ "$BRANCH" = "main" ]; then
            BASE_PATH="/routing-slip-pattern"
            ENV_NAME="production"
          else
            BASE_PATH="/routing-slip-pattern/dev"
            ENV_NAME="development"
          fi

          BASE_HREF="${BASE_PATH%/}/"

          # injeta base path e meta tag legíveis pelo JS do studio
          sed -i "s|</title>|</title><base href=\"${BASE_HREF}\">|" pages-dist/index.html
          sed -i "s|</head>|<meta name=\"studio-env\" content=\"${ENV_NAME}\" data-base=\"${BASE_PATH}\"></head>|" pages-dist/index.html
          find pages-dist -name ".DS_Store" -delete

      - name: publicar no github pages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages-dist
          # main → raiz, develop → /dev
          destination_dir: ${{ github.ref_name == 'main' && '.' || 'dev' }}
          keep_files: true # ← chave: não apaga o outro diretório
