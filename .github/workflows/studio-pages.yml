name: studio pages

on:
  pull_request:
    branches:
      - main
    paths:
      - studio/**
      - .github/workflows/studio-pages.yml
  push:
    branches:
      - main
    paths:
      - studio/**
      - .github/workflows/studio-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: studio-pages
  cancel-in-progress: false

jobs:
  build:
    name: gerar studio
    runs-on: ubuntu-latest

    steps:
      - name: baixar codigo
        uses: actions/checkout@v4

      - name: configurar node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: configurar github pages
        uses: actions/configure-pages@v5

      - name: validar assets do studio
        shell: bash
        run: |
          test -f studio/index.html
          test -f studio/scripts/routing-slip.studio.bootstrap.js
          test -f studio/styles/routing-slip.studio.base.css
          for file in studio/scripts/*.js studio/docs/*.js; do
            node --check "$file"
          done

      - name: montar artefato
        shell: bash
        run: |
          rm -rf pages-dist
          mkdir -p pages-dist
          cp -R studio/. pages-dist/
          touch pages-dist/.nojekyll

      - name: enviar artefato do pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

  deploy:
    name: publicar pages
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: publicar no github pages
        id: deployment
        uses: actions/deploy-pages@v4
